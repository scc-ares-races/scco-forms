<!DOCTYPE html>
<link rel=stylesheet href={{assets}}/SCCoPIFO.css>
<script type=text/javascript src={{assets}}/SCCoPIFO.js></script>
<title>Check-In Message</title>
<packet-form>
  <div id=form-header>
    <div id=form-title>Check-In Message</div>
  </div>
  <div id=form-header-roo>
    <div class=section-inline>Radio Operator Only:</div>
    <label class=pair>
      <div class=label>Origin Msg #:</div>
      <input name=MsgNo class=message-number required>
    </label>
    <label class=pair>
      <div class=label>Destination Msg #:</div>
      <input name=DestMsgNo class=message-number disabled>
    </label>
  </div>
  <div class=border-thick>
    <div class=layout-grid style="--columns: max-content 1fr max-content 1fr">
      <if:show-addrs>
        <label class="pair colspan4">
          <div class=label>From:</div>
          <input name=FromAddr class=colspan3 readonly>
        </label>
        <label class="pair colspan4">
          <div class=label>To:</div>
          <input name=ToAddr class=colspan3 required>
        </label>
      </if:show-addrs>
      <label class=pair>
        <div class=label>Operator Call Sign:</div>
        <input name=opcall required>
      </label>
      <label class=pair>
        <div class=label>Operator Name:</div>
        <input name=opname required>
      </label>
      <label class=pair>
        <div class=label>Tactical Call Sign:</div>
        <input name=taccall>
      </label>
      <label class=pair>
        <div class=label>Station Name:</div>
        <input name=tacname required-if=taccall else-disallowed>
      </label>
    </div>
  </div>
</packet-form>

<!DOCTYPE html>
<link rel=stylesheet href={{assets}}/SCCoPIFO.css>
<script type=text/javascript src={{assets}}/SCCoPIFO.js></script>
<title>ICS-213 Message Form</title>
<packet-form>
  <form-roo form-title="ICS-213 Message Form" paper-version="PDF: 20260512">
    <div class=layout-grid style="--columns: max-content 1fr max-content 1fr max-content max-content">
      <div class=pair>
        <label for=1a.>3. Date:</label>
        <input id=1a. name=1a. class=date required style={{w-1a.}}>
      </div>
      <div class=pair>
        <label for=1b.>4. Time:</label>
        <input id=1b. name=1b. class=time required style={{w-1b.}}>
      </div>
      <div class=pair>
        <div class=label>5. Handling:</div>
        <div class="layout-horizontal colgap required-group">
          <label>
            <input type=radio name=5. required value=IMMEDIATE>Immediate
            <span>(ASAP)</span>
          </label>
          <label>
            <input type=radio name=5. required value=PRIORITY>Priority
            <span>(&lt;1 hr)</span>
          </label>
          <label>
            <input type=radio name=5. required value=ROUTINE>Routine
            <span>(&lt;2 hrs)</span>
          </label>
        </div>
      </div>
    </div>
    <div class=layout-grid style="--columns: max-content max-content 1fr max-content max-content 1fr">
      <div class=to-from style="grid-area:1/1/6/2">TO</div>
      <div class=to-from style="grid-area:1/4/6/5">FROM</div>
      <if:show-addrs>
        <div class=pair style="grid-area:1/2/2/4">
          <label for=ToAddr>Address:</label>
          <input id=ToAddr name=ToAddr required>
        </div>
      </if:show-addrs>
      <div class=pair style="grid-area:2/2/3/4">
        <label for=7.>6. ICS Position:</label>
        <input id=7. name=7. required style={{w-7.}}>
      </div>
      <div class=pair style="grid-area:3/2/4/4">
        <label for=9a.>7. Location:</label>
        <input id=9a. name=9a. required style={{w-9a.}}>
      </div>
      <div class=pair style="grid-area:4/2/5/4">
        <label for=ToName>8. Name:</label>
        <input id=ToName name=ToName style={{w-ToName}}>
      </div>
      <div class=pair style="grid-area:5/2/6/4">
        <label for=ToTel>9. Contact Info:</label>
        <input id=ToTel name=ToTel style={{w-ToTel}}>
      </div>
      <if:show-addrs>
        <div class=pair style="grid-area:1/5/2/7">
          <label for=FromAddr>Address:</label>
          <input id=FromAddr name=FromAddr readonly>
        </div>
      </if:show-addrs>
      <div class=pair style="grid-area:2/5/3/7">
        <label for=8.>10. ICS Position:</label>
        <input id=8. name=8. required style={{w-8.}}>
      </div>
      <div class=pair style="grid-area:3/5/4/7">
        <label for=9b.>11. Location:</label>
        <input id=9b. name=9b. required style={{w-9b.}}>
      </div>
      <div class=pair style="grid-area:4/5/5/7">
        <label for=FmName>12. Name:</label>
        <input id=FmName name=FmName style={{w-FmName}}>
      </div>
      <div class=pair style="grid-area:5/5/6/7">
        <label for=FmTel>13. Contact Info:</label>
        <input id=FmTel name=FmTel style={{w-FmTel}}>
      </div>
    </div>
    <div class=layout-grid style="--columns: repeat(4, max-content) 1fr">
      <div class="subsec rowspan2" style="display:flex;align-items:center">
        This message requests you to:
      </div>
      <div class="pair colspan4">
        <div class=label>Take Action:</div>
        <div class=colspan3>
          <label><input type=radio name=6a. value=Yes>Yes</label>
          <label><input type=radio name=6a. value=No>No</label>
        </div>
        <div class=label>Reply:</div>
        <div>
          <label><input type=radio name=6b. value=Yes>Yes</label>
          <label><input type=radio name=6b. value=No>No</label>
        </div>
        <label for=6d.>Reply By:</label>
        <input id=6d. name=6d. allowed-if="6b.=Yes" style="{{w-6d.}}">
      </div>
    </div>
    <div class=layout-pair>
      <div class=pair>
        <label for=10.>Subject:</label>
        <input id=10. name=10. required style="{{w-10.}}">
      </div>
      <div class=pair>
        <label for=1.>Reference:</label>
        <input id=11. name=11. style="{{w-11.}}">
      </div>
      <div class=pair>
        <label for=12.>Message:</label>
        <textarea id=12. name=12. required style="{{w-12.}}"></textarea>
      </div>
    </div>
  </form-roo>
</packet-form>

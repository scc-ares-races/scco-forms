<!DOCTYPE html>
<link rel=stylesheet href={{assets}}/SCCoPIFO.css>
<script type=text/javascript src={{assets}}/SCCoPIFO.js></script>
<title>ICS-213 Message Form</title>
<packet-form>
  <form-roo form-title="ICS-213 Message Form" paper-version="PDF: 20260512">
    <div class=layout-grid style="--columns: max-content 1fr max-content 1fr max-content max-content">
      <label class=pair>
        <div class=label>3. Date:</div>
        <input id=1a. name=1a. class=date required style={{w-1a.}}>
      </label>
      <label class=pair>
        <div class=label>4. Time:</div>
        <input name=1b. class=time required style={{w-1b.}}>
      </label>
      <div class=pair>
        <div class=label>5. Handling:</div>
        <div class="layout-horizontal colgap required-group">
          <label>
            <input type=radio name=5. required value=IMMEDIATE>Immediate
            <span>(ASAP)</span>
          </label>
          <label>
            <input type=radio name=5. required value=PRIORITY>Priority
            <span>(&lt;1 hr)</span>
          </label>
          <label>
            <input type=radio name=5. required value=ROUTINE>Routine
            <span>(&lt;2 hrs)</span>
          </label>
        </div>
      </div>
    </div>
    <div class=layout-grid style="--columns: max-content max-content 1fr max-content max-content 1fr">
      <div class=to-from style="grid-area:1/1/6/2">TO</div>
      <div class=to-from style="grid-area:1/4/6/5">FROM</div>
      <if:show-addrs>
        <label class=pair style="grid-area:1/2/2/4">
          <div class=label>Address:</div>
          <input name=ToAddr required>
        </label>
      </if:show-addrs>
      <label class=pair style="grid-area:2/2/3/4">
        <div class=label>6. ICS Position:</div>
        <input name=7. required style={{w-7.}}>
      </label>
      <label class=pair style="grid-area:3/2/4/4">
        <div class=label>7. Location:</div>
        <input name=9a. required style={{w-9a.}}>
      </label>
      <label class=pair style="grid-area:4/2/5/4">
        <div class=label>8. Name:</div>
        <input name=ToName style={{w-ToName}}>
      </label>
      <label class=pair style="grid-area:5/2/6/4">
        <div class=label>9. Contact Info:</div>
        <input name=ToTel style={{w-ToTel}}>
      </label>
      <if:show-addrs>
        <label class=pair style="grid-area:1/5/2/7">
          <div class=label>Address:</div>
          <input name=FromAddr readonly>
        </label>
      </if:show-addrs>
      <label class=pair style="grid-area:2/5/3/7">
        <div class=label>10. ICS Position:</div>
        <input name=8. required style={{w-8.}}>
      </label>
      <label class=pair style="grid-area:3/5/4/7">
        <div class=label>11. Location:</div>
        <input name=9b. required style={{w-9b.}}>
      </label>
      <label class=pair style="grid-area:4/5/5/7">
        <div class=label>12. Name:</div>
        <input name=FmName style={{w-FmName}}>
      </label>
      <label class=pair style="grid-area:5/5/6/7">
        <div class=label>13. Contact Info:</div>
        <input name=FmTel style={{w-FmTel}}>
      </label>
    </div>
    <div class=layout-grid style="--columns: repeat(4, max-content) 1fr">
      <div class="subsec rowspan2" style="display:flex;align-items:center">
        This message requests you to:
      </div>
      <div class="pair colspan4">
        <div class=label>Take Action:</div>
        <div class=colspan3>
          <label><input type=radio name=6a. value=Yes>Yes</label>
          <label><input type=radio name=6a. value=No>No</label>
        </div>
        <div class=label>Reply:</div>
        <div>
          <label><input type=radio name=6b. value=Yes>Yes</label>
          <label><input type=radio name=6b. value=No>No</label>
        </div>
        <label for=6d.>Reply By:</label>
        <input id=6d. name=6d. allowed-if="6b.=Yes" style="{{w-6d.}}">
      </div>
    </div>
    <div class=layout-pair>
      <label class=pair>
        <div class=label>Subject:</div>
        <input name=10. required style="{{w-10.}}">
      </label>
      <label class=pair>
        <div class=label>Reference:</div>
        <input name=11. style="{{w-11.}}">
      </label>
      <label class=pair>
        <div class=label>Message:</div>
        <textarea name=12. required style="{{w-12.}}"></textarea>
      </label>
    </div>
  </form-roo>
</packet-form>

<def:combo-box name="Input control name attribute" options="List of dropdown values, separated by semicolons"
  required="Input is required" placeholder="String to display in input field before a value is entered"
  style="Control style" class="Control class name">
  <div class="combobox combobox-list {{class}}">
    <div class="group">
      <input id="{{name}}-input" {{name}} class="cb_edit" {{placeholder}} {{required}} {{style}} role="combobox"
        aria-autocomplete="both" aria-expanded="false" aria-controls="{{name}}-listbox">
      <button type="button" id="{{name}}-button" aria-expanded="false" aria-controls="{{name}}-listbox" tabindex="-1">
        <svg width="18" height="16" aria-hidden="true" focusable="false" style="forced-color-adjust: auto">
          <polygon class="arrow" stroke-width="0" fill-opacity="0.75" fill="currentcolor" points="3,6 15,6 9,14">
          </polygon>
        </svg>
      </button>
    </div>
    <ul id="{{name}}-listbox" role="listbox">
      <for:options>
        <li role="option">{{.}}</li>
      </for:options>
    </ul>
  </div>
</def:combo-box>

<def:packet-form submit-url="URL for form submit" submit-label="Label for the submit button"
  save-label="Label for the save button" pdf-url="URL for the Show PDF button">
  <div id=form-controls>
    <div id=button-header>
      <input type=button id=submit disabled value="Submit Form" value={{submit-label}}>
      <if:save-label>
        <input type=button id=save value={{save-label}}>
      </if:save-label>
      <input type=button id=reset value="Reset Form">
      <if:pdf-url>
        <input type=button id=show-PDF value="Blank PDF" onclick="window.open('{{pdf-url}}', '_blank')">
      </if:pdf-url>
      <span id=invalid-example>
        <input class=invalid disabled style="margin-left:1em;width:2em;border:1px solid #cccccc;" />
        <span>&nbsp;&nbsp;= required</span>
      </span>
    </div>
    <div id=error></div>
  </div>
  <div id=form-holder>
    <form id=the-form method=POST action={{submit-url}} style="width:60rem">
      <slot></slot>
    </form>
  </div>
</def:packet-form>

<def:form-roo form-title="Title to put in the top banner.  Required."
  form-version="Form version number to put in the top banner.  Required."
  paper-version="Paper form version number or date to put in the top banner." omistyle dmistyle rrstyle rsstyle opstyle
  ocstyle odstyle otstyle>
  <div id=form-header>
    <div id=form-title>{{form-title}} {{form-version}}</div>
    <div>PIF: {{form-version}}</div>
    <div>{{paper-version}}</div>
  </div>
  <div id=form-header-roo>
    <div class=section-inline>Radio Operator Only:</div>
    <label class=pair>
      <div class=label>1. Origin Msg #:</div>
      <input name=MsgNo class=message-number required style={{w-MsgNo}}>
    </label>
    <label class=pair>
      <div class=label>2. Destination Msg #:</div>
      <input name=DestMsgNo class=message-number disabled style={{w-DestMsgNo}}>
    </label>
  </div>
  <div class=border-thick>
    <slot></slot>
  </div>
  <div id=form-footer-relay>
    <div class="section-inline colspan5">Radio Operator Only:</div>
    <div class=section-inline>Relay:</div>
    <label class=pair>
      <div class=label>Rcvd:</div>
      <input name=OpRelayRcvd style={{w-OpRelayRcvd}}>
    </label>
    <label class=pair>
      <div class=label>Sent:</div>
      <input name=OpRelaySent style={{w-OpRelaySent}}>
    </label>
  </div>
  <div id=form-footer-opinfo>
    <label class=pair>
      <div class=label>Name:</div>
      <input name=OpName required style={{w-OpName}}>
    </label>
    <label class=pair>
      <div class=label>Call Sign:</div>
      <input name=OpCall class=call-sign required style={{w-OpCall}}>
    </label>
    <label class=pair>
      <div class=label>Date:</div>
      <input name=OpDate class=date style={{w-OpDate}}>
    </label>
    <label class=pair>
      <div class=label>Time <span class=annotation>(24hr)</span>:</div>
      <input name=OpTime class=time style={{w-OpTime}}>
    </label>
  </div>
</def:form-roo>

<def:form-dthtf show-addrs="True if the form should have To/From Address fields."
  to-ics-positions="Semicolon-separated list of possibilities for To ICS Position"
  to-locations="Semicolon-separated list of possibilities for To Location" mdstyle mtstyle tostyle frstyle>
  <div class=layout-grid style="--columns: max-content 1fr max-content 1fr max-content max-content">
    <label class=pair>
      <div class=label>3. Date:</div>
      <input name=1a. class=date required style={{w-1a.}}>
    </label>
    <label class=pair>
      <div class=label>4. Time:</div>
      <input name=1b. class=time required style={{w-1b.}}>
    </label>
    <div class=pair>
      <div class=label>5. Handling:</div>
      <div class="layout-horizontal colgap required-group">
        <label>
          <input type=radio name=5. required value=IMMEDIATE>Immediate
          <span>(ASAP)</span>
        </label>
        <label>
          <input type=radio name=5. required value=PRIORITY>Priority
          <span>(&lt;1 hr)</span>
        </label>
        <label>
          <input type=radio name=5. required value=ROUTINE>Routine
          <span>(&lt;2 hrs)</span>
        </label>
      </div>
    </div>
  </div>
  <div class=layout-grid style="--columns: max-content max-content 1fr max-content max-content 1fr">
    <div class=to-from style="grid-area:1/1/6/2">TO</div>
    <div class=to-from style="grid-area:1/4/6/5">FROM</div>
    <if:show-addrs>
      <label class=pair style="grid-area:1/2/2/4">
        <div class=label>Address:</div>
        <input name=ToAddr required>
      </label>
    </if:show-addrs>
    <label class=pair style="grid-area:2/2/3/4">
      <div class=label>6. ICS Position:</div>
      <if:to-ics-positions>
        <combo-box name=7a. required options={{to-ics-positions}} style={{w-7a.}}></combo-box>
      </if:to-ics-positions>
      <ifnot:to-ics-positions>
        <input name=7a. required style={{w-7a.}}>
      </ifnot:to-ics-positions>
    </label>
    <label class=pair style="grid-area:3/2/4/4">
      <div class=label>7. Location:</div>
      <if:to-locations>
        <combo-box name=7b. required options={{to-locations}} style={{w-7b.}}></combo-box>
      </if:to-locations>
      <ifnot:to-locations>
        <input name=7b. required style={{w-7b.}}>
      </ifnot:to-locations>
    </label>
    <label class=pair style="grid-area:4/2/5/4">
      <div class=label>8. Name:</div>
      <input name=7c. style={{w-7c.}}>
    </label>
    <label class=pair style="grid-area:5/2/6/4">
      <div class=label>9. Contact Info:</div>
      <input name=7d. style={{w-7d.}}>
    </label>
    <if:show-addrs>
      <label class=pair style="grid-area:1/5/2/7">
        <div class=label>Address:</div>
        <input name=FromAddr readonly>
      </label>
    </if:show-addrs>
    <label class=pair style="grid-area:2/5/3/7">
      <div class=label>10. ICS Position:</div>
      <input name=8a. required style={{w-8a.}}>
    </label>
    <label class=pair style="grid-area:3/5/4/7">
      <div class=label>11. Location:</div>
      <input name=8b. required style={{w-8b.}}>
    </label>
    <label class=pair style="grid-area:4/5/5/7">
      <div class=label>12. Name:</div>
      <input name=8c. style={{w-8c.}}>
    </label>
    <label class=pair style="grid-area:5/5/6/7">
      <div class=label>13. Contact Info:</div>
      <input name=8d. style={{w-8d.}}>
    </label>
  </div>
</def:form-dthtf>

<def:the-form submit-url="URL for form submit" submit-label="Label for the submit button"
  save-label="Label for the save button" pdf-url="URL for the Show PDF button">
  <form id=the-form method=POST action={{submit-url}}>
    <slot></slot>
  </form>
  <table id=button-header class=same-line-label-layout>
    <tr>
      <td style="vertical-align:middle;white-space:nowrap;">
        <input type=button id=submit tabindex=600 disabled value="Submit Form" value={{submit-label}}
          style="font-weight:bold">
        <if:save-label>
          <input type=button id=save tabindex=601 value={{save-label}} style="font-weight:bold">
        </if:save-label>
        &nbsp;&nbsp;
        <input type=button id=reset tabindex=602 value="Reset Form">
        <if:pdf-url>
          <input type=button id=show-PDF tabindex=603 value="Show PDF" onclick="window.open('{{pdf-url}}', '_blank')">
        </if:pdf-url>
        <span id=invalid-example>
          <input type=text class=invalid disabled style="margin-left:1em;width:2em;border:1px solid #cccccc;" />
          &nbsp;&nbsp;= required
        </span>
        <div id=error></div>
      </td>
    </tr>
  </table>
</def:the-form>

<!DOCTYPE html>
<link rel=stylesheet href={{assets}}/SCCoPIFO.css>
<script type=text/javascript src={{assets}}/SCCoPIFO.js></script>
<title>Road Closure</title>
<packet-form>
  <form-roo form-title="Road Closure" paper-version="PDF: 20260503">
    <form-dthtf to-ics-positions="Public Works Group; Construction &amp; Eng. Branch; Operations"
      to-locations="County EOC"></form-dthtf>
    <div class=section>Initial Information</div>
    <div class="layout-pair">
      <label class=pair>
        <div class=label>21. Jurisdiction:</div>
        <jurisdiction-box name=20. style="{{w-20.}}"></jurisdiction-box>
      </label>
      <label class=pair>
        <div class=label>22. Road/Intersection:</div>
        <input name=21. required style="{{w-21.}}">
      </label>
    </div>
    <div class="layout-pair">
      <label class=pair>
        <div class=label>23. Location:</div>
        <textarea name=22. required style="{{w-22.}}"></textarea>
      </label>
      <label class=pair>
        <div class=label>24. Details:</div>
        <textarea name=23. required style="{{w-23.}}"></textarea>
      </label>
      <div class=pair>
        <div class=label>25. Status:</div>
        <div class="layout-horizontal colgap required-group">
          <label><input type=radio name=24. value="Planned Closure">a. Planned Closure</label>
          <label><input type=radio name=24. value=Closed>b. Closed</label>
          <label><input type=radio name=24. value=Reopened>c. Reopened</label>
        </div>
      </div>
    </div>
    <div class=section>Closure Time</div>
    <div class="layout-grid" style="--columns: max-content 1fr max-content 1fr">
      <label class=pair>
        <div class=label>31. Closure Start Date:</div>
        <input name=30d. class=date style="{{w-30d.}}">
      </label>
      <label class=pair>
        <div class=label>32. Closure Start Time:</div>
        <input name=30t. class=time required-if=30d. else-disallowed style="{{w-30t.}}">
      </label>
      <label class=pair>
        <div class=label>33. Closure End Date:</div>
        <input name=31d. class=date style="{{w-31d.}}">
      </label>
      <label class=pair>
        <div class=label>34. Closure End Time:</div>
        <input name=31t. class=time required-if=31d. else-disallowed style="{{w-31t.}}">
      </label>
    </div>
  </form-roo>
</packet-form>
